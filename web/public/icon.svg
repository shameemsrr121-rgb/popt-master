<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Accent Glow -->
  <circle cx="256" cy="240" r="140" fill="#2563eb" opacity="0.12" filter="blur(40px)" />

  <!-- Clipboard / PO Document Body -->
  <rect x="136" y="130" width="240" height="280" rx="28" fill="#ffffff" />
  
  <!-- Clipboard Top Clip -->
  <rect x="196" y="104" width="120" height="48" rx="14" fill="#0284c7" />
  <rect x="226" y="86" width="60" height="28" rx="8" fill="#38bdf8" />
  <circle cx="256" cy="128" r="8" fill="#ffffff" />

  <!-- PO Lines on Document -->
  <!-- Header row -->
  <rect x="166" y="180" width="100" height="16" rx="8" fill="#e2e8f0" />
  <rect x="296" y="180" width="50" height="16" rx="8" fill="#cbd5e1" />

  <!-- Item Rows -->
  <rect x="166" y="214" width="180" height="8" rx="4" fill="#f1f5f9" />
  <rect x="166" y="234" width="140" height="8" rx="4" fill="#f1f5f9" />
  
  <!-- Check / Verified Stamp -->
  <circle cx="256" cy="300" r="48" fill="url(#gradGreen)" />
  <path d="M236 300 L250 314 L278 286" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Brand Badge -->
  <rect x="166" y="366" width="180" height="26" rx="13" fill="#1e293b" />
  <text x="256" y="384" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">POPT MASTER</text>

  <!-- Trip / Truck Route Indicator (Accent icon bottom right) -->
  <circle cx="380" cy="390" r="44" fill="url(#gradRed)" stroke="#0f172a" stroke-width="6" />
  <!-- Truck Icon -->
  <path d="M362 384 L378 384 L386 392 L394 392 L394 402 L362 402 Z" fill="#ffffff" />
  <circle cx="370" cy="404" r="5" fill="#ffffff" />
  <circle cx="388" cy="404" r="5" fill="#ffffff" />
</svg>
